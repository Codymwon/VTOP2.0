services:
  - type: web
    name: vtop-portal
    env: node
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install && npx prisma db push && npm run prisma:seed && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: file:./dev.db
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
